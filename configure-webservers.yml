---
- name: Configure web servers
  hosts: webservers
  become: true

  tasks:

    - name: Install Nginx
      ansible.builtin.yum:
        name: nginx
        state: present

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy index.html
      ansible.builtin.copy:
        src: files/index.html
        dest: /usr/share/nginx/html/index.html
      notify: Reload Nginx

  handlers:

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded